version: '3.8'

services:
  lexai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexai-legal-assistant
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5000
      - JWT_SECRET=super_secret_jwt_key_lexai_2026_indian_law
    volumes:
      - ./server/uploads:/app/server/uploads
